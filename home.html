<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SaaS Hub Dashboard</title>
    <!-- Add your Tailwind, FontAwesome, and standard CSS links here -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50">

    <div class="flex flex-col items-center justify-center min-h-screen p-6">
        <h1 class="text-4xl font-black text-indigo-900 mb-8">Select a Portal</h1>

        <div class="grid grid-cols-2 gap-8 w-full max-w-4xl">
            <!-- Redirects to Exam Manager -->
            <a href="exam.html" class="bg-white rounded-2xl shadow-xl p-8 border-t-8 border-indigo-600 text-center block">
                <i class="fas fa-file-signature text-5xl text-indigo-600 mb-4"></i>
                <h2 class="text-2xl font-black text-gray-800">Exam Manager</h2>
            </a>

            <!-- Redirects to Routine Manager -->
            <a href="routine.html" class="bg-white rounded-2xl shadow-xl p-8 border-t-8 border-teal-600 text-center block">
                <i class="fas fa-calendar-alt text-5xl text-teal-600 mb-4"></i>
                <h2 class="text-2xl font-black text-gray-800">Routine Manager</h2>
            </a>
        </div>

        <button onclick="logoutUser()" class="mt-8 text-red-600 font-bold">Secure Logout</button>
    </div>

    <script src="supabase-config.js"></script>
    <script src="app.js"></script>
</body>
</html>
