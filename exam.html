<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Exam & Absentee Manager</title>
    
    <!-- LIBRARIES -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        /* Utilities */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .custom-scroll::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        /* Calendar Specific */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
        .calendar-cell { min-height: 80px; transition: all 0.2s; position: relative; }
        
        /* Custom Context Menu */
        #customContextMenu { position: fixed; z-index: 99999; display: none; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); }

        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; color: black !important; }
            #printArea { position: absolute; left: 0; top: 0; width: 100%; display: block !important; }
            .no-print { display: none !important; }
        }
    </style>
</head>

            <button onclick="renderView('checker')" class="bg-cyan-600 hover:bg-cyan-500 text-white px-3 py-1.5 rounded shadow text-xs font-black transition-colors flex items-center">
                <i class="fas fa-search md:mr-1.5"></i> <span class="hidden lg:inline">Checker</span>
            </button>
            <button onclick="renderView('setup')" class="bg-teal-600 hover:bg-teal-500 text-white px-3 py-1.5 rounded shadow text-xs font-black transition-colors flex items-center">
                <i class="fas fa-cogs md:mr-1.5"></i> <span class="hidden lg:inline">Setup</span>
            </button>

    <!-- HIDDEN PRINT AREA -->

    <!-- SUPABASE & CORE LOGIC -->
    <script src="supabase-config.js"></script>
    <script>
        // GLOBALS & STATE
        const dbClient = typeof supabaseClient !== 'undefined' ? supabaseClient : window.supabase;
        let globalSchoolId = null;
        let savedSchoolName = "Examination";
        let currentActiveView = 'setup';
        
        let teachersCache = [];
        let roomConfigsCache = [];
        let scheduleCache = []; // Now holds both 'exam' and 'event' objects
        let dutyRecordsCache = {}; 
        let absenteesCache = {};
        let recordIds = { rooms: null, schedule: null, duty: null, absentees: null, teachers: null };

        // Calendar State
        let currentCalMonth = new Date().getMonth();
        let currentCalYear = new Date().getFullYear();
        let ctxSelectedDate = null;

        // INITIALIZATION
        window.addEventListener('DOMContentLoaded', async () => {
            // Force Admin role and School ID 1 if missing
            let role = sessionStorage.getItem('userRole') || localStorage.getItem('userRole') || 'admin'; 
            globalSchoolId = sessionStorage.getItem('schoolId') || localStorage.getItem('schoolId') || '1';
            savedSchoolName = sessionStorage.getItem('schoolName') || localStorage.getItem('schoolName') || "Patkabari High School";

            document.getElementById('examSchoolNameDisplay').textContent = savedSchoolName;
            await fetchExamData();
            renderView('setup'); 
        });

        /* =====================================================
           DATABASE FETCHING (FETCH ALL EXAM_DB DATA)
        ==================================================== */
        async function fetchExamData() {
            try {
                const numId = parseInt(globalSchoolId, 10);
                const { data, error } = await dbClient
                    .from('exam_db')
                    .select('id, data_key, json_payload')
                    .eq('school_id', numId);

                if (error) throw error;

                if (data && data.length > 0) {
                    data.forEach(row => {
                        let payload = row.json_payload;
                        if (typeof payload === 'string') { 
                            try { payload = JSON.parse(payload); } catch(e) {} 
                        }
                        
                        if (row.data_key === 'teachers' || row.data_key === 'staff') { 
                            teachersCache = Array.isArray(payload) ? payload.map(t => typeof t === 'object' && t !== null ? t.name : t).filter(Boolean) : [];
                            recordIds.teachers = row.id; 
                        }
                        else if (row.data_key === 'roomConfigs') { 
                            roomConfigsCache = Array.isArray(payload) ? payload : (Object.keys(payload || {}).length > 0 ? Object.values(payload) : []); 
                            recordIds.rooms = row.id; 
                        }
                        else if (row.data_key === 'schedule') { 
                            scheduleCache = Array.isArray(payload) ? payload : (Object.keys(payload || {}).length > 0 ? Object.values(payload) : []); 
                            recordIds.schedule = row.id; 
                        }
                        else if (row.data_key === 'dutyRecords') { 
                            dutyRecordsCache = Array.isArray(payload) ? payload[0] || {} : payload || {};
                            recordIds.duty = row.id; 
                        }
                        else if (row.data_key === 'absentees') { 
                            absenteesCache = Array.isArray(payload) ? payload[0] || {} : payload || {};
                            recordIds.absentees = row.id; 
                        }
                    });
                }
                console.log("Exam Data successfully synced.");
            } catch (err) {
                console.error("Fetch Error:", err);
                alert("Failed to load exam data from server.");
            }
        }

        async function refreshData() {
            const btn = document.getElementById('btn-refresh');
            if(btn) btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            await fetchExamData();
            renderView(currentActiveView);
            if(btn) btn.innerHTML = '<i class="fas fa-sync-alt"></i>';
        }

        /* =====================================================
           VIEW ROUTER
        ==================================================== */
        function renderView(viewName) {
            currentActiveView = viewName;
            const workspace = document.getElementById('main-workspace');
            
            if (viewName === 'setup') {
                workspace.innerHTML = `
                    <div class="max-w-6xl mx-auto flex flex-col gap-6">
                        <!-- CSV UPLOADERS WITH DOWNLOAD BUTTONS -->
                        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                            <div class="bg-indigo-50 p-3 md:p-4 border-b border-indigo-100 flex items-center">
                                <i class="fas fa-cogs text-indigo-600 mr-2 text-lg md:text-xl"></i><h2 class="font-black text-indigo-900 text-sm md:text-base">Architecture Setup & Data Sync</h2>
                            </div>
                            <div class="p-4 md:p-6 grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6 bg-slate-50">
                                
                                <div class="bg-white p-4 rounded-lg border border-slate-200 shadow-sm flex flex-col">
                                    <h3 class="text-[10px] md:text-xs font-bold text-slate-700 uppercase tracking-wide mb-3 flex items-center justify-between">
                                        <span>1. Rooms</span>
                                        <button onclick="downloadCSV('rooms')" class="text-indigo-600 hover:text-indigo-800 bg-indigo-50 px-2 py-1 rounded" title="Download Current Data"><i class="fas fa-download mr-1"></i> Backup</button>
                                    </h3>
                                    <input type="file" id="csvRooms" accept=".csv" class="w-full text-xs text-slate-500 mb-3 border p-1 rounded cursor-pointer">

        /* =====================================================
           FEATURE 1: DOWNLOAD DATA AS CSV
        ==================================================== */
        function downloadCSV(type) {
            let csv = '';
            if(type === 'rooms') {
                csv += 'Room Name,Gender,Capacity,Classes\n';
                roomConfigsCache.forEach(r => {
                    let cap = r.totalCapacity || 0;
                    let cls = (r.classesList || []).join(';');
                    csv += `"${r.name}","${r.gender}",${cap},"${cls}"\n`;
                });
            } else if (type === 'schedule') {
                csv += 'Date,Time,Classes_Or_Title,Subject_Or_Description,Exam_Name,Type\n';
                scheduleCache.forEach(s => {
                    let typeVal = s.type || 'exam';
                    let col3 = typeVal === 'exam' ? (s.classes || '') : (s.title || '');
                    let col4 = typeVal === 'exam' ? (s.subject || '') : (s.description || '');
                    let col5 = typeVal === 'exam' ? (s.examName || '') : '';
                    csv += `"${s.date}","${s.time || ''}","${col3}","${col4}","${col5}","${typeVal}"\n`;
                });
            } else if (type === 'staff') {
                csv += 'Name\n';
                teachersCache.forEach(t => csv += `"${t}"\n`);
            }
            
            let blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            let link = document.createElement("a");
            let url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", `${savedSchoolName.replace(/\s+/g,'_')}_${type}_backup.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function changeCalMonth(offset) {
            currentCalMonth += offset;
            if (currentCalMonth > 11) { currentCalMonth = 0; currentCalYear++; }
            else if (currentCalMonth < 0) { currentCalMonth = 11; currentCalYear--; }
            renderVisualCalendar();
        }

            // Group items by date

            scheduleCache.forEach(s => {

            // Build Top Bar
            let html = `

                        <h3 class="font-black text-lg md:text-xl text-indigo-900 w-40 text-center">${monthNames[currentCalMonth]} ${currentCalYear}</h3>
                        <button onclick="changeCalMonth(1)" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition-colors"><i class="fas fa-chevron-right"></i></button>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="openPrintCalendarModal()" class="bg-indigo-100 text-indigo-800 hover:bg-indigo-200 px-3 py-1.5 rounded shadow-sm text-[10px] md:text-xs font-bold transition-colors border border-indigo-200"><i class="fas fa-print mr-1"></i> Print Calendar Data</button>
                    </div>
                </div>
                <div class="text-[10px] md:text-xs text-slate-500 italic mb-2 text-center md:text-left"><i class="fas fa-info-circle text-indigo-400 mr-1"></i> Tip: Right-click (or long-press on mobile) any day to manually add an exam or event. Click a day to view/edit details.</div>
                
                <div class="bg-white rounded-lg border border-slate-200 shadow-sm overflow-hidden">
                    <div class="grid grid-cols-7 bg-slate-100 text-slate-600 font-bold text-center text-[10px] md:text-xs uppercase tracking-wider">
                        <div class="py-2 border-b border-r">Sun</div><div class="py-2 border-b border-r">Mon</div><div class="py-2 border-b border-r">Tue</div>
                        <div class="py-2 border-b border-r">Wed</div><div class="py-2 border-b border-r">Thu</div><div class="py-2 border-b border-r">Fri</div>
                        <div class="py-2 border-b">Sat</div>
                    </div>
                    <div class="grid grid-cols-7">
            `;

            for (let i = 0; i < firstDayIndex; i++) {
                html += `<div class="calendar-cell bg-slate-50 border-r border-b border-slate-100 opacity-50"></div>`;
            }

            for (let day = 1; day <= daysInMonth; day++) {
                let dateStr = `${currentCalYear}-${String(currentCalMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                let dayItems = grouped[dateStr] || [];
                
                let badges = '';
                if (dayItems.length > 0) {
                    badges = `<div class="mt-1 flex flex-col gap-1">`;
                    dayItems.slice(0, 2).forEach(item => {
                        let isExam = (!item.type || item.type === 'exam');
                        if (isExam) {
                            badges += `<span class="bg-teal-100 text-teal-800 text-[8px] md:text-[9px] font-bold px-1 py-0.5 rounded truncate border border-teal-200 shadow-sm" title="${item.subject}"><i class="fas fa-file-alt mr-1 opacity-50"></i>${item.subject || 'Exam'}</span>`;
                        } else {
                            badges += `<span class="bg-amber-100 text-amber-800 text-[8px] md:text-[9px] font-bold px-1 py-0.5 rounded truncate border border-amber-200 shadow-sm" title="${item.title}"><i class="fas fa-calendar-check mr-1 opacity-50"></i>${item.title || 'Event'}</span>`;
                        }
                    });
                    if (dayItems.length > 2) {
                        badges += `<span class="text-[8px] font-black text-slate-500 text-center">+${dayItems.length - 2} more</span>`;
                    }
                    badges += `</div>`;
                }

                let bgClass = dayItems.length > 0 ? 'bg-indigo-50/20' : 'bg-white';
                let borderClass = dayItems.length > 0 ? 'border-indigo-200' : 'border-slate-100';

                html += `
                    <div class="calendar-cell ${bgClass} border-r border-b ${borderClass} p-1 md:p-2 cursor-pointer hover:bg-slate-50 transition-colors group" 
                         onclick="showExamsForDay('${dateStr}')"

                            <span class="font-bold text-slate-700 text-xs md:text-sm group-hover:text-indigo-600">${day}</span>

            html += `</div></div>`;

        // Custom Context Menu Logic
        function handleCalendarRightClick(e, dateStr) {
            e.preventDefault(); 
            ctxSelectedDate = dateStr;
            const menu = document.getElementById('customContextMenu');
            document.getElementById('ctxMenuDate').innerText = dateStr.split('-').reverse().join('-');
            
            menu.style.display = 'block';
            let x = e.pageX; let y = e.pageY;
            if (x + 192 > window.innerWidth) x = window.innerWidth - 192;
            if (y + 120 > window.innerHeight) y = window.innerHeight - 120;
            
            menu.style.left = x + 'px';
            menu.style.top = y + 'px';
        }

        function closeContextMenu() {
            document.getElementById('customContextMenu').style.display = 'none';
        }

        // Save Operations
        async function saveManualExam() {
            const id = document.getElementById('manExamId').value;
            const d = document.getElementById('manExamDate').value;
            const t = document.getElementById('manExamTime').value.trim();
            const c = document.getElementById('manExamClasses').value.trim();
            const s = document.getElementById('manExamSubject').value.trim();
            const n = document.getElementById('manExamName').value.trim() || 'Examination';

            if (!d || !t || !c || !s) return alert("Fill all required fields.");

            if (id) {
                let idx = scheduleCache.findIndex(x => x.id === id);
                if(idx > -1) {
                    scheduleCache[idx].date = d; scheduleCache[idx].time = t;
                    scheduleCache[idx].classes = c; scheduleCache[idx].subject = s;
                    scheduleCache[idx].examName = n;
                }
            } else {
                scheduleCache.push({ id: 'M' + Date.now(), type: 'exam', date: d, time: t, classes: c, subject: s, examName: n });
            }
            
            await finalizeCalendarSave('manualExamModal');
        }

        async function saveManualEvent() {
            const id = document.getElementById('manEventId').value;
            const d = document.getElementById('manEventDate').value;
            const t = document.getElementById('manEventTime').value.trim();
            const title = document.getElementById('manEventTitle').value.trim();
            const desc = document.getElementById('manEventDesc').value.trim();

            if (!d || !title) return alert("Date and Title are required.");

            if (id) {
                let idx = scheduleCache.findIndex(x => x.id === id);
                if(idx > -1) {
                    scheduleCache[idx].date = d; scheduleCache[idx].time = t;
                    scheduleCache[idx].title = title; scheduleCache[idx].description = desc;
                }
            } else {
                scheduleCache.push({ id: 'E' + Date.now(), type: 'event', date: d, time: t, title: title, description: desc });
            }
            
            await finalizeCalendarSave('manualEventModal');
        }

        async function deleteCalendarItem(id) {
            if(!confirm("Delete this entry permanently?")) return;
            scheduleCache = scheduleCache.filter(s => s.id !== id);
            await finalizeCalendarSave('dayDetailsModal');
        }

        async function finalizeCalendarSave(modalToClose) {
            try {
                await saveToDB('schedule', scheduleCache, 'schedule');
                if(modalToClose) closeModal(modalToClose);
                renderVisualCalendar();
            } catch(e) {
                alert("Failed to save. Network error.");
            }
        }

        function executeCalendarPrint() {
            let filter = document.getElementById('calPrintFilter').value;
            if(scheduleCache.length === 0) return alert("No data available.");

            let dataToPrint = scheduleCache.filter(item => {
                let isExam = (!item.type || item.type === 'exam');
                if (filter === 'exams' && !isExam) return false;
                if (filter === 'events' && isExam) return false;
                return true;
            });

            if (dataToPrint.length === 0) return alert('No data matches the selected filter.');

            dataToPrint.sort((a,b) => new Date(a.date) - new Date(b.date) || (a.time || '').localeCompare(b.time || ''));

            let html = `<html><head><title>Academic Calendar Data</title><style>

                .td-center { text-align: center; font-weight: bold;}

                <h1>${savedSchoolName}</h1>

                <table>
                    <thead><tr><th>Date</th><th>Time</th><th>Type</th><th>Details</th></tr></thead>
                    <tbody>
            `;

            dataToPrint.forEach(s => {
                let displayDate = s.date.split('-').reverse().join('-');
                let isExam = (!s.type || s.type === 'exam');
                let typeStr = isExam ? 'EXAM' : 'EVENT';
                let details = isExam 
                    ? `<b>${s.classes || ''}</b> - ${s.subject || ''} <br><span style="font-size:11px; color:#555;">(${s.examName || ''})</span>` 
                    : `<b>${s.title || ''}</b> <br><span style="font-size:11px; color:#555;">${s.description || ''}</span>`;

                html += `<tr>
                    <td class="td-center">${displayDate}</td>

                    <td>${details}</td>

            html += `</tbody></table></body></html>`;
            const w = window.open('', '_blank');
            w.document.write(html);

                        <select id="edit-room-gender-${idx}" class="w-full border border-slate-300 p-1.5 rounded outline-none focus:border-indigo-500 font-bold text-slate-700 bg-white shadow-inner text-[10px] md:text-xs">
                            <option value="Boys" ${room.gender && room.gender.toLowerCase() === 'boys' ? 'selected' : ''}>Boys</option>
                            <option value="Girls" ${room.gender && room.gender.toLowerCase() === 'girls' ? 'selected' : ''}>Girls</option>
                            <option value="Mixed" ${room.gender && room.gender.toLowerCase() === 'mixed' ? 'selected' : ''}>Mixed</option>
                        </select>
                    </td>
                    <td class="p-2">
                        <textarea id="edit-room-classes-${idx}" rows="3" class="w-full border border-slate-300 p-1.5 rounded outline-none focus:border-indigo-500 text-[10px] font-mono text-slate-800 leading-relaxed whitespace-pre shadow-inner" spellcheck="false">${classText}</textarea>
                    </td>
                    <td class="p-2 text-center align-middle">
                        <button onclick="saveRoomEdit(${idx}, this)" class="bg-emerald-500 hover:bg-emerald-600 text-white px-2 py-2 md:py-1.5 rounded shadow-sm text-[10px] font-black transition-colors flex items-center justify-center w-full mt-1">
                            <i class="fas fa-save md:mr-1"></i> <span class="hidden md:inline">Save</span>
                        </button>
                    </td>
                </tr>`;
            });

            html += `</tbody></table></div>`;
            container.innerHTML = html;
        }

        async function saveRoomEdit(idx, btn) {
            const nameEl = document.getElementById(`edit-room-name-${idx}`);
            const genderEl = document.getElementById(`edit-room-gender-${idx}`);
            const classesEl = document.getElementById(`edit-room-classes-${idx}`);

            const newName = nameEl.value.trim();
            const newGender = genderEl.value;
            const classLines = classesEl.value.split('\n').filter(l => l.trim() !== '');

            if (!newName) return alert("Please provide a valid Room Name.");

            let newClassDetails = [];
            let newClassesList = [];
            let totalCap = 0;

            for (let line of classLines) {
                let parts = line.split('|').map(p => p.trim());
                if(parts.length >= 3) {
                    let cName = parts[0];
                    let cRolls = parts[1];
                    let cCap = parseInt(parts[2], 10);
                    if(!isNaN(cCap)) {
                        newClassesList.push(cName);
                        newClassDetails.push({ className: cName, rolls: cRolls, capacity: cCap });
                        totalCap += cCap;
                    }
                } else {
                    return alert("Invalid format. Please use: Class | Rolls | Capacity");
                }
            }

            roomConfigsCache[idx].name = newName;
            roomConfigsCache[idx].gender = newGender;
            roomConfigsCache[idx].classesList = newClassesList;
            roomConfigsCache[idx].classDetails = newClassDetails;
            roomConfigsCache[idx].totalCapacity = totalCap;

            const oldHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            btn.classList.replace('bg-emerald-500', 'bg-slate-500');

            try {
                await saveToDB('roomConfigs', roomConfigsCache, 'rooms');
                btn.innerHTML = '<i class="fas fa-check md:mr-1"></i> <span class="hidden md:inline">Saved</span>';
                btn.classList.replace('bg-slate-500', 'bg-emerald-600');
                setTimeout(() => {
                    btn.innerHTML = oldHtml;
                    btn.classList.replace('bg-emerald-600', 'bg-emerald-500');
                }, 2000);
            } catch (e) {
                alert("Failed to save room update.");
                btn.innerHTML = oldHtml;
                btn.classList.replace('bg-slate-500', 'bg-emerald-500');
            }
        }

        /* =====================================================
           CSV PARSER LOGIC
        ==================================================== */
        async function processCSV(type) {
            let fileId = type === 'rooms' ? 'csvRooms' : (type === 'schedule' ? 'csvSchedule' : 'csvStaff');
            const file = document.getElementById(fileId).files[0];
            if (!file) return alert(`Select ${type} CSV.`);
            
            const reader = new FileReader();
            reader.onload = async (e) => {
                const rows = e.target.result.split('\n');
                const delimiter = rows[0].includes('\t') ? '\t' : ',';
                let payload = [];

                if (type === 'staff') {
                    rows.forEach(r => { let name = r.trim().replace(/"/g, ''); if(name && name.toLowerCase() !== 'name') payload.push(name); });
                    if(payload.length > 0) {
                        teachersCache = payload;
                        await saveToDB('teachers', teachersCache, 'teachers');
                        alert("Staff imported successfully.");
                    }
                } else if (type === 'rooms') {
                    let roomsMap = {};
                    for(let i=1; i<rows.length; i++) {
                        let cols = rows[i].split(delimiter);
                        if (cols.length >= 4 && cols[0].trim() !== '') {
                            let rName = cols[0].trim().replace(/"/g, '');
                            let rGender = cols[1].trim().replace(/"/g, '');
                            let rCapStr = cols[2].trim().replace(/"/g, '');
                            let rClass = cols[3].trim().replace(/"/g, ''); 
                            let rCap = parseInt(rCapStr, 10);

                            let rId = 'R' + rName.replace(/\s+/g,'');
                            if(!roomsMap[rId]) roomsMap[rId] = { id: rId, name: rName, gender: rGender, classesList: [], classDetails: [], totalCapacity: 0 };
                            
                            let classArray = rClass.split(/[\s,;]+/).filter(Boolean);
                            classArray.forEach(cName => {
                                if (!roomsMap[rId].classesList.includes(cName)) {
                                    roomsMap[rId].classesList.push(cName);
                                    let dividedCap = Math.floor((isNaN(rCap)?0:rCap) / classArray.length);
                                    roomsMap[rId].classDetails.push({ className: cName, rolls: "1-40", capacity: dividedCap });
                                }
                            });
                            roomsMap[rId].totalCapacity = isNaN(rCap) ? 0 : rCap;
                        }
                    }
                    payload = Object.values(roomsMap);
                    if(payload.length > 0) {
                        roomConfigsCache = payload;
                        await saveToDB('roomConfigs', roomConfigsCache, 'rooms');
                        alert("Rooms imported. Go to 'Manage Rooms' to set exact rolls.");
                        switchSetupTab('rooms');
                    }
                } else if (type === 'schedule') {
                    for(let i=1; i<rows.length; i++) {
                        let cols = rows[i].split(delimiter);
                        if (cols.length >= 5 && cols[0].trim() !== '') {
                            let sType = cols[5] ? cols[5].trim().replace(/"/g, '').toLowerCase() : 'exam';
                            if (sType === 'event') {
                                payload.push({ id: 'E'+Date.now()+i, type: 'event', date: cols[0].trim().replace(/"/g, ''), time: cols[1].trim().replace(/"/g, ''), title: cols[2].trim().replace(/"/g, ''), description: cols[3].trim().replace(/"/g, '') });
                            } else {
                                payload.push({ id: 'S'+Date.now()+i, type: 'exam', date: cols[0].trim().replace(/"/g, ''), time: cols[1].trim().replace(/"/g, ''), classes: cols[2].trim().replace(/"/g, ''), subject: cols[3].trim().replace(/"/g, ''), examName: cols[4].trim().replace(/"/g, '').replace(/\r/g, '') });
                            }
                        }
                    }
                    if(payload.length > 0) {
                        scheduleCache = payload;
                        await saveToDB('schedule', scheduleCache, 'schedule');
                        alert("Schedule & Events imported successfully.");
                        switchSetupTab('schedule');
                    }
                }
            };
            reader.readAsText(file);
        }

        async function saveToDB(key, payload, type) {
            const numId = parseInt(globalSchoolId, 10);
            if (recordIds[type]) await dbClient.from('exam_db').update({ json_payload: payload }).eq('id', recordIds[type]);
            else {
                const { data } = await dbClient.from('exam_db').insert({ data_key: key, json_payload: payload, school_id: numId }).select();
                if(data) recordIds[type] = data[0].id;
            }
        }

        /* =====================================================
           ROOM STICKERS VIEW (A4 LANDSCAPE SUPPORT)
        ==================================================== */
        function renderRoomStickers(workspace) {
            if (!roomConfigsCache || roomConfigsCache.length === 0) {
                workspace.innerHTML = '<p class="text-slate-500 italic text-center py-10 font-bold">No rooms synchronized yet. Please setup rooms via CSV first.</p>';
                return;
            }

            let roomCheckboxes = roomConfigsCache.map((r, idx) => `
                <label class="flex items-center gap-3 p-3 bg-white border border-slate-200 rounded-lg shadow-sm cursor-pointer hover:bg-pink-50 hover:border-pink-300 transition-colors">
                    <input type="checkbox" value="${r.id}" class="sticker-room-chk w-5 h-5 text-pink-600 rounded focus:ring-pink-500" checked>
                    <div>
                        <div class="font-black text-slate-800 text-base leading-tight">${r.name}</div>
                        <div class="text-xs text-slate-500 font-bold mt-0.5">Classes: ${r.classesList ? r.classesList.join(', ') : 'None'}</div>
                    </div>
                </label>
            `).join('');

            workspace.innerHTML = `
                <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-sm border border-slate-200 p-4 md:p-6">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 border-b pb-4 gap-4">
                        <div>
                            <h2 class="font-black text-slate-800 text-lg md:text-xl flex items-center"><i class="fas fa-tags mr-2 text-pink-500"></i> Room Door Stickers</h2>
                            <p class="text-[10px] md:text-xs text-slate-500 font-bold mt-1">Select rooms to generate professional A4 landscape door signs.</p>
                        </div>
                        <button onclick="printRoomStickers()" class="w-full sm:w-auto bg-pink-600 hover:bg-pink-700 text-white font-black px-6 py-2.5 rounded shadow-md transition-colors flex items-center justify-center">
                            <i class="fas fa-print mr-2"></i> Print Selected
                        </button>
                    </div>
                    
                    <div class="mb-4 flex gap-4 bg-slate-50 p-2 rounded border border-slate-200 w-max">
                        <button onclick="document.querySelectorAll('.sticker-room-chk').forEach(cb => cb.checked = true)" class="text-[10px] md:text-xs font-bold text-indigo-600 hover:underline"><i class="fas fa-check-square mr-1"></i> Select All</button>
                        <span class="text-slate-300">|</span>
                        <button onclick="document.querySelectorAll('.sticker-room-chk').forEach(cb => cb.checked = false)" class="text-[10px] md:text-xs font-bold text-slate-500 hover:underline"><i class="far fa-square mr-1"></i> Deselect All</button>
                    </div>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 md:gap-4">
                        ${roomCheckboxes}
                    </div>
                </div>
            `;
        }

        /* =====================================================
           ABSENTEE CHECKER VIEW 
        ==================================================== */
        function renderChecker(workspace) {
            let uniqueDates = [...new Set(scheduleCache.map(s => s.date))].sort((a,b) => new Date(a) - new Date(b));
            let dateOptions = uniqueDates.map(d => `<option value="${d}">${d.split('-').reverse().join('-')}</option>`).join('');

            let allClasses = new Set();
            roomConfigsCache.forEach(r => r.classesList.forEach(c => allClasses.add(c)));
            let classOptions = Array.from(allClasses).sort().map(c => `<option value="${c}">${c}</option>`).join('');

            workspace.innerHTML = `
                <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-sm border border-slate-200 p-4 md:p-6">
                    <h2 class="font-black text-slate-800 text-base md:text-lg mb-4 border-b pb-2"><i class="fas fa-search text-cyan-500 mr-2"></i> Absentee & Room Checker</h2>
                    
                    <div class="flex flex-col gap-3 md:gap-4 mb-4">
                        <div><label class="text-[10px] md:text-xs font-bold text-slate-600 block mb-1">Select Date:</label>
                        <select id="chkDate" class="w-full p-2 border border-slate-300 rounded font-bold text-slate-700 outline-none"><option value="">-- Date --</option>${dateOptions}</select></div>
                        
                        <div><label class="text-[10px] md:text-xs font-bold text-slate-600 block mb-1">Select Class:</label>
                        <select id="chkClass" class="w-full p-2 border border-slate-300 rounded font-bold text-slate-700 outline-none"><option value="">-- Class --</option>${classOptions}</select></div>
                        
                        <div><label class="text-[10px] md:text-xs font-bold text-slate-600 block mb-1">Select Gender (Optional):</label>
                        <select id="chkGender" class="w-full p-2 border border-slate-300 rounded font-bold text-slate-700 outline-none">
                            <option value="">All Types</option>
                            <option value="Girls">Girls</option>
                            <option value="Boys">Boys</option>
                            <option value="Mixed">Mixed</option>
                        </select></div>

                        <div><label class="text-[10px] md:text-xs font-bold text-slate-600 block mb-1">Enter Roll No:</label>
                        <input type="number" id="chkRoll" class="w-full p-2 border border-slate-300 rounded font-bold text-slate-700 outline-none" placeholder="e.g. 15"></div>
                        
                        <button onclick="executeCheck()" class="w-full bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-2.5 rounded shadow-sm text-xs mt-2 transition-colors">Check Status</button>
                    </div>
                    <div id="chkResult" class="hidden mt-4 flex flex-col gap-2"></div>
                </div>
            `;
        }

        function executeCheck() {
            const d = document.getElementById('chkDate').value;
            const c = document.getElementById('chkClass').value.trim().toUpperCase();
            const g = (document.getElementById('chkGender')?.value || '').trim().toUpperCase();
            const r = document.getElementById('chkRoll').value;
            const resBox = document.getElementById('chkResult');

            if (!d || !c || !r) {
                resBox.className = "mt-2 p-2 rounded border text-[10px] md:text-xs text-center font-bold bg-amber-50 text-amber-800 border-amber-300";
                resBox.innerText = "Please select Date, Class, and enter Roll No.";
                resBox.classList.remove('hidden');
                return;
            }

            let matchingRooms = [];
            for (let room of roomConfigsCache) {
                let roomGender = String(room.gender || '').trim().toUpperCase();
                if (g && roomGender && roomGender !== g && roomGender !== 'MIXED') continue;

                let details = room.classDetails || [];
                if (details.length === 0 && room.classesList) details = room.classesList.map(clsName => ({ className: clsName, rolls: "1-200" }));

                let classDet = details.find(cd => String(cd.className).trim().toUpperCase() === c);
                if (classDet) {
                    let rolls = expandRolls(classDet.rolls);
                    if (rolls.length === 0 || rolls.includes(r.toString())) {
                        matchingRooms.push(room);
                    }
                }
            }

            resBox.classList.remove('hidden');

            if (matchingRooms.length === 0) {
                resBox.className = "mt-2 p-3 rounded-lg border-2 text-center flex flex-col gap-1 leading-tight bg-amber-50 text-amber-800 border-amber-300 shadow-inner";
                resBox.innerHTML = `
                    <span class="font-black text-sm mb-1">⚠️ Not Allocated</span>
                    <div class="bg-white/80 border border-amber-200 rounded p-2 mx-auto shadow-sm w-full">
                        <span class="font-bold text-sm text-slate-800">Class ${c} - Roll ${r} ${g ? '(' + g + ')' : ''}</span>
                    </div>
                    <span class="text-[10px] mt-1">No seat allocated in any matching room.</span>`;
                return;
            }

            let resultHTML = '';
            matchingRooms.forEach(foundRoom => {
                let safeAbsData = absenteesCache[d] || {};
                if (Array.isArray(safeAbsData)) safeAbsData = safeAbsData[0] || {};
                const isAbsent = safeAbsData[foundRoom.id] && safeAbsData[foundRoom.id].includes(`${c}_${r}`);
                
                let safeDutyData = dutyRecordsCache[d] || {};
                if (Array.isArray(safeDutyData)) safeDutyData = safeDutyData[0] || {};
                
                let invigList = safeDutyData[foundRoom.id] ? (safeDutyData[foundRoom.id].invigs || []).filter(Boolean).join(', ') : '';
                let dutyRec = invigList || 'None Assigned';

                if (isAbsent) {
                    resultHTML += `
                    <div class="p-3 rounded-lg border-2 text-center flex flex-col gap-2 leading-tight bg-rose-50 text-rose-800 border-rose-300 shadow-inner">
                        <span class="font-black text-sm"><i class="fas fa-times-circle mr-1"></i> MARKED ABSENT</span>
                        <div class="bg-white/80 border border-rose-200 rounded p-2 mx-auto shadow-sm w-full">
                            <span class="font-black text-sm text-slate-800 block">Class ${c} - Roll ${r}</span>
                            <span class="font-bold text-xs text-rose-600 block mt-0.5">(${foundRoom.gender || 'General'})</span>
                        </div>
                        <div class="bg-white/50 rounded p-2 border border-rose-200">
                            <span class="block font-bold text-xs text-slate-800">Allocated: Room ${foundRoom.name}</span>
                            <span class="block text-[9px] mt-1 text-slate-600">Invigilators: ${dutyRec}</span>
                        </div>
                    </div>`;
                } else {
                    resultHTML += `
                    <div class="p-3 rounded-lg border-2 text-center flex flex-col gap-2 leading-tight bg-emerald-50 text-emerald-800 border-emerald-300 shadow-sm">
                        <span class="font-black text-sm"><i class="fas fa-check-circle mr-1"></i> ALLOCATED / PRESENT</span>
                        <div class="bg-white/80 border border-emerald-200 rounded p-2 mx-auto shadow-sm w-full">
                            <span class="font-black text-sm text-slate-800 block">Class ${c} - Roll ${r}</span>
                            <span class="font-bold text-xs text-emerald-700 block mt-0.5">(${foundRoom.gender || 'General'})</span>
                        </div>
                        <div class="bg-white/50 rounded p-2 border border-emerald-200">
                            <span class="block font-bold text-xs text-slate-800">Allocated: Room ${foundRoom.name}</span>
                            <span class="block text-[9px] mt-1 text-slate-600">Invigilators: ${dutyRec}</span>
                        </div>
                    </div>`;
                }
            });

            resBox.className = "mt-2 flex flex-col gap-2";
            resBox.innerHTML = resultHTML;
        }

        function closeModal(modalId) { document.getElementById(modalId).classList.add('hidden'); }
    </script>
