<!DOCTYPE html>

                <i class="fas fa-home md:mr-1.5"></i> <span class="hidden md:inline">Hub</span>
            </a>
            <button onclick="renderView('checker')" class="bg-cyan-600 hover:bg-cyan-500 text-white px-3 py-1.5 rounded shadow text-xs font-black transition-colors flex items-center">
                <i class="fas fa-search md:mr-1.5"></i> <span class="hidden md:inline">Checker</span>

            <button onclick="renderView('setup')" class="bg-teal-600 hover:bg-teal-500 text-white px-3 py-1.5 rounded shadow text-xs font-black transition-colors flex items-center">
                <i class="fas fa-cogs md:mr-1.5"></i> <span class="hidden md:inline">Setup</span>
            </button>
            <button onclick="renderView('duty')" class="bg-amber-500 hover:bg-amber-400 text-white px-3 py-1.5 rounded shadow text-xs font-black transition-colors flex items-center">
                <i class="fas fa-user-check md:mr-1.5"></i> <span class="hidden md:inline">Duty Board</span>
            </button>

            <button onclick="renderView('stickers')" class="bg-pink-600 hover:bg-pink-500 text-white px-3 py-1.5 rounded shadow text-xs font-black transition-colors flex items-center">
                <i class="fas fa-tags md:mr-1.5"></i> <span class="hidden md:inline">Stickers</span>
            </button>

            <button onclick="renderView('report')" class="bg-purple-600 hover:bg-purple-500 text-white px-3 py-1.5 rounded shadow text-xs font-black transition-colors flex items-center">
                <i class="fas fa-calculator md:mr-1.5"></i> <span class="hidden md:inline">Report</span>
            </button>
        </div>
    </nav>

    <!-- MAIN WORKSPACE -->
    <main class="flex-1 overflow-y-auto p-4 md:p-6 custom-scroll no-print" id="main-workspace"></main>

    <!-- ABSENTEE MODAL -->

                    <h3 class="text-lg font-black text-slate-800" id="absenteeModalTitle">Room Absentees</h3>

                </div>
                <button onclick="closeModal('absenteeModal')" class="text-slate-400 hover:text-rose-600 text-2xl transition-colors">&times;</button>
            </div>
            <div class="flex-1 overflow-y-auto custom-scroll mb-4 pr-2">
                <div id="absenteeRollGrid" class="flex flex-col gap-4"></div>
            </div>
            <div class="flex gap-2 shrink-0 border-t pt-4">
                <button onclick="closeModal('absenteeModal')" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2 rounded text-xs transition-colors">Cancel</button>

    <!-- EXCLUDE STAFF MODAL -->
    <div id="excludeModal" class="fixed inset-0 bg-slate-900/80 hidden z-50 flex items-center justify-center backdrop-blur-sm no-print">
        <div class="bg-white p-6 rounded-2xl shadow-xl max-w-md w-full mx-4 flex flex-col max-h-[80vh] border-t-4 border-amber-500">
            <div class="flex justify-between items-center mb-4 border-b pb-2 shrink-0">

            </div>

    </div>

    <!-- ROOM SHEET PRINT MODAL -->
    <div id="roomPrintModal" class="fixed inset-0 bg-slate-900/80 hidden z-50 flex items-center justify-center backdrop-blur-sm no-print">
        <div class="bg-white p-6 rounded-2xl shadow-2xl max-w-md w-full mx-4 border-t-4 border-indigo-500 flex flex-col">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h3 class="text-lg font-black text-slate-800">Print Room Sheet</h3>
                <button onclick="closeModal('roomPrintModal')" class="text-slate-400 hover:text-rose-600 text-2xl transition-colors">&times;</button>
            </div>
            <div class="mb-4">
                <label class="block text-xs font-bold text-slate-700 mb-1">Select Room:</label>
                <select id="printRoomSelect" onchange="populateRoomClasses()" class="w-full p-2 border border-slate-300 rounded outline-none font-bold text-slate-700">

            </div>
            <div class="mb-4">
                <label class="block text-xs font-bold text-slate-700 mb-1">Select Classes to Include:</label>

            <div class="flex gap-2 border-t pt-4">
                <button onclick="closeModal('roomPrintModal')" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2 rounded text-xs transition-colors">Cancel</button>
                <button onclick="executeRoomPrint()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded text-xs transition-colors flex justify-center items-center shadow-md">
                    <i class="fas fa-print mr-1.5"></i> Generate Sheet

        </div>

    <!-- HIDDEN PRINT AREA -->
    <div id="printArea" class="hidden bg-white"></div>

    <!-- SUPABASE & CORE LOGIC -->
    <script src="supabase-config.js"></script>
    <script>
        const dbClient = typeof supabaseClient !== 'undefined' ? supabaseClient : window.supabase;
        let globalSchoolId = null;
        let savedSchoolName = "Examination";
        let currentActiveView = 'duty';
        
        let teachersCache = [];
        let roomConfigsCache = [];
        let scheduleCache = [];
        let dutyRecordsCache = {}; 
        let absenteesCache = {};
        let recordIds = { rooms: null, schedule: null, duty: null, absentees: null, teachers: null };
window.addEventListener('DOMContentLoaded', async () => {
            // Force Admin role and School ID 1 if they are missing (Bypass Login)
            let role = sessionStorage.getItem('userRole') || localStorage.getItem('userRole') || 'admin'; 
            globalSchoolId = sessionStorage.getItem('schoolId') || localStorage.getItem('schoolId') || '1';
            savedSchoolName = sessionStorage.getItem('schoolName') || localStorage.getItem('schoolName') || "Patkabari High School";

            /* Security check commented out for direct GitHub access
            if (role !== 'admin' || !globalSchoolId || isNaN(parseInt(globalSchoolId, 10))) {
                alert("Unauthorized Access. Redirecting to login.");
                window.location.href = 'index.html'; 
                return;
            }
            */
            
            document.getElementById('examSchoolNameDisplay').textContent = savedSchoolName;

            await fetchExamData();
            renderView('duty'); 
        });

        /* =====================================================
           DATABASE FETCHING (FETCH ALL EXAM_DB DATA)
        ==================================================== */
        async function fetchExamData() {
            try {
                const numId = parseInt(globalSchoolId, 10);
                
                // Fetch ALL rows for this school from exam_db without filtering data_keys
                const { data, error } = await dbClient
                    .from('exam_db')
                    .select('id, data_key, json_payload')
                    .eq('school_id', numId);

                if (error) throw error;

                if (data && data.length > 0) {
                    data.forEach(row => {
                        let payload = row.json_payload;
                        
                        // Parse stringified JSON if necessary
                        if (typeof payload === 'string') { 
                            try { payload = JSON.parse(payload); } catch(e) { console.error("JSON Parse Error for", row.data_key); } 
                        }
                        
                        // Map fetched data to correct caches with safe fallbacks
                        if (row.data_key === 'teachers' || row.data_key === 'staff') { 
                            if (Array.isArray(payload)) {
                                // Handles both array of strings ["Name"] AND array of objects [{name: "Name"}]
                                teachersCache = payload.map(t => typeof t === 'object' && t !== null ? t.name : t).filter(Boolean);
                            } else {
                                teachersCache = [];
                            }
                            recordIds.teachers = row.id; 
                        }
                        else if (row.data_key === 'roomConfigs') { 
                            roomConfigsCache = Array.isArray(payload) ? payload : (Object.keys(payload || {}).length > 0 ? Object.values(payload) : []); 
                            recordIds.rooms = row.id; 
                        }
                        else if (row.data_key === 'schedule') { 
                            scheduleCache = Array.isArray(payload) ? payload : (Object.keys(payload || {}).length > 0 ? Object.values(payload) : []); 
                            recordIds.schedule = row.id; 
                        }
                        else if (row.data_key === 'dutyRecords') { 
                            dutyRecordsCache = (payload !== null && typeof payload === 'object' && !Array.isArray(payload)) ? payload : {}; 
                            recordIds.duty = row.id; 
                        }
                        else if (row.data_key === 'absentees') { 
                            absenteesCache = (payload !== null && typeof payload === 'object' && !Array.isArray(payload)) ? payload : {}; 
                            recordIds.absentees = row.id; 
                        }
                    });
                }
                console.log("Exam Data successfully synced from Supabase.");
            } catch (err) {
                console.error("Fetch Error:", err);
                alert("Failed to load exam data from server.");
            }
        }

        async function refreshData() {
            const btn = document.getElementById('btn-refresh');
            if(btn) btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            await fetchExamData();
            renderView(currentActiveView);
            if(btn) btn.innerHTML = '<i class="fas fa-sync-alt"></i>';
        }

        /* =====================================================
           VIEW ROUTER
        ==================================================== */
        /* =====================================================
           VIEW ROUTER & SETUP MANAGEMENT
        ==================================================== */
        function renderView(viewName) {
            currentActiveView = viewName;
            const workspace = document.getElementById('main-workspace');
            
            if (viewName === 'setup') {
                workspace.innerHTML = `
                    <div class="max-w-6xl mx-auto flex flex-col gap-6">
                        <!-- CSV UPLOADERS -->
                        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                            <div class="bg-indigo-50 p-4 border-b border-indigo-100 flex items-center">
                                <i class="fas fa-cogs text-indigo-600 mr-2 text-xl"></i><h2 class="font-black text-indigo-900">Architecture Setup</h2>
                            </div>
                            <div class="p-6 grid grid-cols-1 md:grid-cols-3 gap-6 bg-slate-50">
                                <div class="bg-white p-4 rounded border border-slate-200 shadow-sm relative">
                                    <h3 class="text-xs font-bold text-slate-700 uppercase tracking-wide mb-2">1. Room Configurations</h3>
                                    <input type="file" id="csvRooms" accept=".csv" class="w-full text-xs text-slate-500 mb-2">
                                    <button onclick="processCSV('rooms')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded text-xs transition-colors">Sync Rooms</button>
                                </div>
                                <div class="bg-white p-4 rounded border border-slate-200 shadow-sm relative">
                                    <h3 class="text-xs font-bold text-slate-700 uppercase tracking-wide mb-2">2. Exam Schedule</h3>
                                    <input type="file" id="csvSchedule" accept=".csv" class="w-full text-xs text-slate-500 mb-2">
                                    <button onclick="processCSV('schedule')" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-2 rounded text-xs transition-colors">Sync Schedule</button>
                                </div>
                                <div class="bg-white p-4 rounded border border-slate-200 shadow-sm relative">
                                    <h3 class="text-xs font-bold text-slate-700 uppercase tracking-wide mb-2">3. Staff / Teachers</h3>
                                    <input type="file" id="csvStaff" accept=".csv" class="w-full text-xs text-slate-500 mb-2">
                                    <button onclick="processCSV('staff')" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 rounded text-xs transition-colors">Sync Staff</button>
                                </div>
                            </div>
                        </div>

                        <!-- SYNCHRONIZED DATA VIEWER -->
                        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                            <div class="bg-slate-100 p-4 border-b border-slate-200 flex justify-between items-center">
                                <h2 class="font-black text-slate-800"><i class="fas fa-database mr-2 text-indigo-500"></i> Synchronized Data</h2>
                                <div class="flex gap-2">
                                    <button onclick="switchSetupTab('schedule')" id="tab-setup-schedule" class="bg-indigo-600 text-white px-3 py-1.5 rounded font-bold text-xs shadow-sm transition-colors">📅 Exam Calendar</button>
                                    <button onclick="switchSetupTab('rooms')" id="tab-setup-rooms" class="bg-slate-200 text-slate-700 hover:bg-slate-300 px-3 py-1.5 rounded font-bold text-xs shadow-sm transition-colors">🏫 Manage Rooms</button>
                                </div>
                            </div>
                            <div id="setup-data-container" class="p-6 bg-slate-50 min-h-[300px]">
                                <!-- Content injected via switchSetupTab -->
                            </div>
                        </div>
                    </div>
                `;
                // Load the calendar tab by default when opening setup
                setTimeout(() => switchSetupTab('schedule'), 50);
            } 
            else if (viewName === 'duty') {
                buildDutyBoard(workspace);
            } 
            else if (viewName === 'checker') {
                renderChecker(workspace);
            }

            else if (viewName === 'stickers') {
                renderRoomStickers(workspace);
            }

            else if (viewName === 'report') {
                renderDutyReport(workspace);
            }
        }

        /* =====================================================
           SETUP: TABS & EDITORS
        ==================================================== */
        function switchSetupTab(tab) {
            const schedBtn = document.getElementById('tab-setup-schedule');
            const roomsBtn = document.getElementById('tab-setup-rooms');
            
            if (tab === 'schedule') {
                schedBtn.className = "bg-indigo-600 text-white px-3 py-1.5 rounded font-bold text-xs shadow-sm transition-colors";
                roomsBtn.className = "bg-slate-200 text-slate-700 hover:bg-slate-300 px-3 py-1.5 rounded font-bold text-xs shadow-sm transition-colors";
                renderScheduleCalendar();
            } else {
                roomsBtn.className = "bg-indigo-600 text-white px-3 py-1.5 rounded font-bold text-xs shadow-sm transition-colors";
                schedBtn.className = "bg-slate-200 text-slate-700 hover:bg-slate-300 px-3 py-1.5 rounded font-bold text-xs shadow-sm transition-colors";
                renderRoomManager();
            }
        }

        function renderScheduleCalendar() {
            const container = document.getElementById('setup-data-container');
            if (!scheduleCache || scheduleCache.length === 0) {
                container.innerHTML = '<p class="text-slate-500 italic text-center py-10 font-bold">No schedule synchronized yet. Upload CSV above.</p>';
                return;
            }

            // Group schedules by date
            let grouped = {};
            scheduleCache.forEach(s => {
                if(!grouped[s.date]) grouped[s.date] = [];
                grouped[s.date].push(s);
            });

            let html = '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">';
            
            Object.keys(grouped).sort().forEach(date => {
                let displayDate = date.split('-').reverse().join('-');
                html += `
                <div class="bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden flex flex-col">
                    <div class="bg-teal-600 text-white p-2 font-black text-center text-sm border-b-2 border-teal-700">
                        <i class="fas fa-calendar-day mr-2"></i>${displayDate}
                    </div>
                    <div class="p-3 flex flex-col gap-2 flex-1">`;
                
                // Sort by time within the day
                grouped[date].sort((a,b) => a.time.localeCompare(b.time)).forEach(exam => {
                    html += `
                        <div class="border-l-4 border-teal-500 pl-2 bg-slate-50 p-2 rounded shadow-sm">
                            <div class="text-[11px] font-black text-indigo-900 uppercase">${exam.examName || 'Exam'}</div>
                            <div class="text-[11px] font-bold text-rose-600 mt-1">${exam.subject}</div>
                            <div class="text-[10px] text-slate-600 mt-1 flex justify-between">
                                <span><i class="fas fa-clock text-teal-600 mr-1"></i> ${exam.time}</span>
                                <span class="bg-slate-200 px-1 rounded font-bold">Class: ${exam.classes}</span>
                            </div>
                        </div>`;
                });
                html += `</div></div>`;
            });
            html += '</div>';
            container.innerHTML = html;
        }

/* =====================================================
           CSV PROCESSORS (Rooms)
        ===================================================== */
        async function processRoomCSV() {
            const file = document.getElementById('csvRooms').files[0];
            if (!file) return alert("Select a Room CSV first.");
            
            const reader = new FileReader();
            reader.onload = async (e) => {
                const rows = e.target.result.split('\n');
                let newRooms = [];
                for(let i=1; i<rows.length; i++) { // Skip header
                    let cols = rows[i].split(',');
                    if (cols.length >= 4 && cols[0].trim() !== '') {
                        
                        // Parse classes from CSV (e.g., "V-A;V-B")
                        let rawClasses = cols[3].trim().replace(/\r/g, '');
                        let classArray = rawClasses.split(/[\s,;]+/).filter(Boolean);
                        let totalCap = parseInt(cols[2].trim(), 10) || 0;
                        
                        // Automatically build the details structure for editing
                        let details = classArray.map(c => ({
                            className: c,
                            rolls: "1-40", // Default placeholder for rolls
                            capacity: Math.floor(totalCap / classArray.length) || 0 // Divide capacity evenly
                        }));

                        newRooms.push({
                            id: 'R' + Date.now() + i,
                            name: cols[0].trim(),
                            gender: cols[1].trim(),
                            totalCapacity: totalCap,
                            classesList: classArray,
                            classDetails: details
                        });
                    }
                }
                if(newRooms.length > 0) {
                    roomConfigsCache = newRooms;
                    await saveToDB('roomConfigs', roomConfigsCache, 'rooms');
                    alert(`Imported ${newRooms.length} rooms successfully. Go to 'Manage Rooms' to set exact rolls.`);
                    // Auto-switch to the Room Manager tab to see the results
                    switchSetupTab('rooms');
                } else {
                    alert("No valid rows found. Ensure you have 4 columns: Room Name, Gender, Capacity, Classes.");
                }
            };
            reader.readAsText(file);
        }

        /* =====================================================
           SETUP TABS: ROOM EDITING
        ==================================================== */
        function renderRoomManager() {
            const container = document.getElementById('setup-data-container');
            if (!roomConfigsCache || roomConfigsCache.length === 0) {
                container.innerHTML = '<p class="text-slate-500 italic text-center py-10 font-bold">No rooms synchronized yet. Upload CSV above.</p>';
                return;
            }

            let html = `<div class="overflow-x-auto rounded-lg shadow-sm border border-slate-200">
                <table class="w-full text-xs text-left border-collapse bg-white">
                <thead class="bg-slate-200 text-slate-700">
                    <tr>
                        <th class="p-3 border-b font-black uppercase w-32">Room Name</th>
                        <th class="p-3 border-b font-black uppercase w-24">Gender</th>
                        <th class="p-3 border-b font-black uppercase">Classes & Rolls <span class="text-[9px] font-normal normal-case block text-slate-500 mt-0.5">Format: Class | Rolls | Capacity (One per line)</span></th>
                        <th class="p-3 border-b font-black uppercase text-center w-24">Actions</th>
                    </tr>
                </thead>
                <tbody>`;
            
            roomConfigsCache.forEach((room, idx) => {
                
                // Safety fallback for older data that doesn't have classDetails mapped
                let details = room.classDetails || [];
                if (details.length === 0 && room.classesList) {
                     details = room.classesList.map(c => ({ className: c, rolls: "1-40", capacity: room.totalCapacity || 40 }));
                }

                // Pre-fill textarea with existing classes, rolls, and capacities
                let classText = details.map(c => `${c.className} | ${c.rolls || '1-40'} | ${c.capacity}`).join('\n');

                html += `
                <tr class="border-b hover:bg-slate-50 transition-colors align-top">
                    <td class="p-2"><input type="text" id="edit-room-name-${idx}" value="${room.name}" class="w-full border border-slate-300 p-1.5 rounded outline-none focus:border-indigo-500 font-bold text-slate-800 shadow-inner"></td>
                    <td class="p-2">
                        <select id="edit-room-gender-${idx}" class="w-full border border-slate-300 p-1.5 rounded outline-none focus:border-indigo-500 font-bold text-slate-700 bg-white shadow-inner">
                            <option value="Boys" ${room.gender && room.gender.toLowerCase() === 'boys' ? 'selected' : ''}>Boys</option>
                            <option value="Girls" ${room.gender && room.gender.toLowerCase() === 'girls' ? 'selected' : ''}>Girls</option>
                            <option value="Mixed" ${room.gender && room.gender.toLowerCase() === 'mixed' ? 'selected' : ''}>Mixed</option>
                        </select>
                    </td>
                    <td class="p-2">
                        <textarea id="edit-room-classes-${idx}" rows="3" class="w-full border border-slate-300 p-1.5 rounded outline-none focus:border-indigo-500 text-[11px] font-mono text-slate-800 leading-relaxed whitespace-pre shadow-inner" spellcheck="false">${classText}</textarea>
                    </td>
                    <td class="p-2 text-center">

async function saveRoomEdit(idx, btn) {
            const nameEl = document.getElementById(`edit-room-name-${idx}`);
            const genderEl = document.getElementById(`edit-room-gender-${idx}`);
            const classesEl = document.getElementById(`edit-room-classes-${idx}`);

            const newName = nameEl.value.trim();
            const newGender = genderEl.value;
            const classLines = classesEl.value.split('\n').filter(l => l.trim() !== '');

            if (!newName) return alert("Please provide a valid Room Name.");

            let newClassDetails = [];
            let newClassesList = [];
            let totalCap = 0;

            for (let line of classLines) {
                let parts = line.split('|').map(p => p.trim());
                if(parts.length >= 3) {
                    let cName = parts[0];
                    let cRolls = parts[1];
                    let cCap = parseInt(parts[2], 10);
                    if(!isNaN(cCap)) {
                        newClassesList.push(cName);
                        newClassDetails.push({ className: cName, rolls: cRolls, capacity: cCap });
                        totalCap += cCap;
                    }
                } else {
                    return alert("Invalid format. Please use: Class | Rolls | Capacity");
                }
            }

            roomConfigsCache[idx].name = newName;
            roomConfigsCache[idx].gender = newGender;
            roomConfigsCache[idx].classesList = newClassesList;
            roomConfigsCache[idx].classDetails = newClassDetails;
            roomConfigsCache[idx].totalCapacity = totalCap;

            // Button feedback
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            btn.classList.replace('bg-emerald-500', 'bg-slate-500');

            try {
                await saveToDB('roomConfigs', roomConfigsCache, 'rooms');
                btn.innerHTML = '<i class="fas fa-check mr-1"></i> Saved';
                btn.classList.replace('bg-slate-500', 'bg-emerald-600');
                setTimeout(() => {
                    btn.innerHTML = '<i class="fas fa-save mr-1"></i> Save';
                    btn.classList.replace('bg-emerald-600', 'bg-emerald-500');
                }, 2000);
            } catch (e) {
                alert("Failed to save room update to server.");
                btn.innerHTML = '<i class="fas fa-save mr-1"></i> Save';
                btn.classList.replace('bg-slate-500', 'bg-emerald-500');
            }
        }

        function executeCheck() {

function renderDutyGrid() {
            const date = document.getElementById('activeDate').value;
            const gridArea = document.getElementById('dutyGridArea');
            if(!date) { gridArea.innerHTML = ''; return; }

            if(!dutyRecordsCache[date]) dutyRecordsCache[date] = {};
            if(!dutyRecordsCache[date].meta) dutyRecordsCache[date].meta = { isLocked: false };
            if(!absenteesCache[date]) absenteesCache[date] = {};

            const isLocked = dutyRecordsCache[date].meta.isLocked === true || dutyRecordsCache[date].meta.isLocked === "true";
            const lockBtnClass = isLocked ? "bg-rose-500 hover:bg-rose-600" : "bg-emerald-500 hover:bg-emerald-600";
            const lockBtnIcon = isLocked ? "fa-lock" : "fa-lock-open";
            const lockBtnText = isLocked ? "Locked (Staff View-Only)" : "Unlocked (Staff Can Edit Absentees)";

            // 1. CALCULATE PREVIOUS EXAM DATE
            let uniqueDates = [...new Set(scheduleCache.map(s => s.date))].sort((a,b) => new Date(a) - new Date(b));
            let currDateIdx = uniqueDates.indexOf(date);
            let prevDate = currDateIdx > 0 ? uniqueDates[currDateIdx - 1] : null;

            // 2. GET ALL TEACHERS ASSIGNED TODAY (to filter out)
            let allAssignedToday = new Set();
            Object.values(dutyRecordsCache[date]).forEach(r => {
                if(r.invigs) r.invigs.forEach(i => { if(i) allAssignedToday.add(i); });
            });

            // 3. SORT TEACHERS ALPHABETICALLY
            let sortedTeachers = [...teachersCache].sort((a, b) => a.localeCompare(b));

            let tableHTML = `
                <div class="flex justify-between items-center mb-3 p-3 bg-slate-50 border border-slate-200 rounded-lg shadow-sm">
                    <span class="text-sm font-bold text-slate-700"><i class="fas fa-shield-alt text-indigo-500 mr-1.5"></i>Absentee Portal Status:</span>
                    <button onclick="toggleDateLock('${date}')" class="${lockBtnClass} text-white px-4 py-1.5 rounded shadow-md text-xs font-bold transition-colors flex items-center">
                        <i class="fas ${lockBtnIcon} mr-2"></i> ${lockBtnText}
                    </button>
                </div>
                <table class="w-full border-collapse text-xs text-left">
                <thead><tr class="bg-slate-200 text-slate-700">
                    <th class="p-3 border font-black uppercase w-1/3">Room Details & Absentees</th>
                    <th class="p-3 border font-black uppercase w-2/3">Invigilators (Max 3)</th>
                </tr></thead><tbody class="bg-white">`;

            roomConfigsCache.forEach(room => {
                let rDuty = dutyRecordsCache[date][room.id] || { invigs: ['', ''] };
                if(!rDuty.invigs) rDuty.invigs = ['', ''];

                // FETCH PREVIOUS DAY DUTY FOR THIS ROOM
                let prevDutyStr = '<span class="text-slate-400 italic">None</span>';
                if (prevDate && dutyRecordsCache[prevDate] && dutyRecordsCache[prevDate][room.id] && dutyRecordsCache[prevDate][room.id].invigs) {
                    let prevStaff = dutyRecordsCache[prevDate][room.id].invigs.filter(Boolean);
                    if (prevStaff.length > 0) prevDutyStr = prevStaff.join(', ');
                }

                let bg = room.gender.toLowerCase() === 'girls' ? 'bg-pink-50' : 'bg-blue-50';
                let absentCount = (absenteesCache[date][room.id] || []).length;
                let absentBadge = absentCount > 0 ? `<span class="bg-rose-500 text-white px-1.5 py-0.5 rounded text-[9px] font-bold mt-1 inline-block">${absentCount} Absent</span>` : '';

                let invigSelectors = rDuty.invigs.map((inv, idx) => {
                    let optionsHTML = `<option value="">- Select Teacher -</option>`;
                    sortedTeachers.forEach(t => {
                        // Filter Logic: Show teacher only if they aren't assigned anywhere else today, OR if they are currently occupying this exact slot
                        if (!allAssignedToday.has(t) || t === inv) {
                            optionsHTML += `<option value="${t}" ${t === inv ? 'selected' : ''}>${t}</option>`;
                        }
                    });

                    return `
                    <div class="flex items-center gap-1 mb-1">
                        <select onchange="updateDuty('${date}', '${room.id}', ${idx}, this.value)" class="flex-1 p-1.5 border border-slate-300 rounded outline-none shadow-inner font-bold text-slate-700 bg-white">
                            ${optionsHTML}
                        </select>
                        <button onclick="removeInvig('${date}', '${room.id}', ${idx})" class="text-rose-500 hover:bg-rose-100 p-1.5 rounded"><i class="fas fa-times"></i></button>
                    </div>
                    `;
                }).join('');

                let addBtn = rDuty.invigs.length < 3 ? `<button onclick="addInvig('${date}', '${room.id}')" class="text-[10px] bg-slate-200 hover:bg-slate-300 text-slate-700 px-2 py-1 rounded font-bold mt-1 shadow-sm">+ Add Teacher</button>` : '';

                tableHTML += `
                    <tr class="${bg} border-b border-slate-200">
                        <td class="p-3 border align-top">
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <span class="font-black text-slate-800 text-sm">Room ${room.name}</span>
                                    <span class="text-[10px] text-slate-500 block font-bold">Cap: ${room.totalCapacity} | ${room.gender}</span>
                                </div>
                                <button onclick="openAbsenteeModal('${date}', '${room.id}')" class="bg-white text-rose-600 hover:bg-rose-50 px-2 py-1 rounded text-[10px] font-bold border border-rose-200 shadow-sm transition-colors">
                                    <i class="fas fa-user-times"></i> Absentees
                                </button>
                            </div>
                            <div class="text-[10px] font-bold text-slate-700">Classes: ${room.classesList.join(', ')}</div>
                            <div class="text-[9px] font-bold text-indigo-700 mt-1.5 bg-indigo-100 border border-indigo-200 p-1.5 rounded-md shadow-sm">
                                <b>Prev Day Duty:</b><br>${prevDutyStr}
                            </div>
                            ${absentBadge}
                        </td>
                        <td class="p-3 border align-top bg-white/50">
                            ${invigSelectors}
                            ${addBtn}
                        </td>
                    </tr>`;
            });

            tableHTML += `</tbody></table>
                <div class="mt-4 flex justify-end">
                    <button onclick="saveDutyRecords()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-black px-6 py-3 rounded shadow-md transition-colors text-sm">
                        <i class="fas fa-save mr-2"></i> Save Duty Assignments
                    </button>
                </div>`;
            gridArea.innerHTML = tableHTML;
        }
        async function toggleDateLock(date) {
            if(!dutyRecordsCache[date]) dutyRecordsCache[date] = {};
            if(!dutyRecordsCache[date].meta) dutyRecordsCache[date].meta = { isLocked: false };
            
            // Flip the boolean status
            let currentState = dutyRecordsCache[date].meta.isLocked === true || dutyRecordsCache[date].meta.isLocked === "true";
            dutyRecordsCache[date].meta.isLocked = !currentState;
            
            // Instantly refresh the UI to show the new color
            renderDutyGrid();
            
            // Auto-save the lock status to Supabase so staff apps sync immediately
            try {
                await saveToDB('dutyRecords', dutyRecordsCache, 'duty');
            } catch (err) {
                alert("Error syncing lock status with the server.");
            }
        }

        function updateDuty(date, roomId, index, val) {
            if(!dutyRecordsCache[date][roomId]) dutyRecordsCache[date][roomId] = { invigs: [] };
            dutyRecordsCache[date][roomId].invigs[index] = val;
            renderDutyGrid(); // Re-render to update the disabled options immediately
        }
        function addInvig(date, roomId) {
            if(!dutyRecordsCache[date][roomId]) dutyRecordsCache[date][roomId] = { invigs: [] };
            if(dutyRecordsCache[date][roomId].invigs.length < 3) {
                dutyRecordsCache[date][roomId].invigs.push('');
                renderDutyGrid();
            }
        }
        function removeInvig(date, roomId, index) {
            if(dutyRecordsCache[date][roomId] && dutyRecordsCache[date][roomId].invigs) {
                dutyRecordsCache[date][roomId].invigs.splice(index, 1);
                renderDutyGrid();
            }
        }

        /* =====================================================
           EXCLUDE & SMART ASSIGN
        ==================================================== */
        function openExcludeModal() {
            const date = document.getElementById('activeDate').value;
            if(!date) return alert('Select date first');
            
            if(!dutyRecordsCache[date]) dutyRecordsCache[date] = {};
            if(!dutyRecordsCache[date].excluded) dutyRecordsCache[date].excluded = [];
            
            document.getElementById('excludeDateDisplay').innerText = date.split('-').reverse().join('-');
            
            let html = '';
            let sorted = [...teachersCache].sort((a,b) => a.localeCompare(b));
            sorted.forEach(t => {
                let isChecked = dutyRecordsCache[date].excluded.includes(t) ? 'checked' : '';
                html += `<label class="flex items-center gap-2 p-2 bg-slate-50 border border-slate-200 rounded text-xs font-bold text-slate-700 cursor-pointer hover:bg-indigo-50 transition-colors"><input type="checkbox" value="${t}" class="w-4 h-4 text-indigo-600" ${isChecked} onchange="toggleExclude('${date}', '${t}', this.checked)"> ${t}</label>`;
            });
            document.getElementById('excludeGrid').innerHTML = html;
            document.getElementById('excludeModal').classList.remove('hidden');
        }

        function toggleExclude(date, teacher, isChecked) {
            let exc = dutyRecordsCache[date].excluded;
            if(isChecked && !exc.includes(teacher)) exc.push(teacher);
            else if(!isChecked && exc.includes(teacher)) dutyRecordsCache[date].excluded = exc.filter(t => t !== teacher);
            saveToDB('dutyRecords', dutyRecordsCache, 'duty'); // Save silently
        }


function executeSmartAssign() {
            const date = document.getElementById('activeDate').value;
            if(!date) return alert("Select a date first.");

            // Calculate historical workload across all dates
            let workload = {};
            teachersCache.forEach(t => workload[t] = 0);
            Object.keys(dutyRecordsCache).forEach(d => {
                Object.keys(dutyRecordsCache[d]).forEach(key => {
                    // Ignore metadata and exclusions
                    if(key === 'meta' || key === 'excluded') return; 
                    
                    let room = dutyRecordsCache[d][key];
                    (room.invigs || []).forEach(i => { if(i) workload[i]++; });
                });
            });

            // Sort teachers so those with least duties get assigned first
            let availableTeachers = [...teachersCache].sort((a, b) => workload[a] - workload[b]);
            if(!dutyRecordsCache[date]) dutyRecordsCache[date] = {};
            
            let tIndex = 0;
            roomConfigsCache.forEach((room) => {
                // Preserve meta if it exists, otherwise initialize just the room
                if(!dutyRecordsCache[date][room.id]) dutyRecordsCache[date][room.id] = { invigs: [] };
                dutyRecordsCache[date][room.id].invigs = []; // clear existing for fresh assign
                
                if (tIndex < availableTeachers.length) dutyRecordsCache[date][room.id].invigs.push(availableTeachers[tIndex++]);
                if (tIndex < availableTeachers.length) dutyRecordsCache[date][room.id].invigs.push(availableTeachers[tIndex++]);
            });

            renderDutyGrid();
        }

        async function saveDutyRecords() {
            await saveToDB('dutyRecords', dutyRecordsCache, 'duty');
            alert("Duty assignments securely saved to database.");
        }

        /* =====================================================
           ABSENTEE SYSTEM
        ==================================================== */
        let currDate = null, currRoom = null, tempAbs = [];

        function expandRolls(rollString) {
            let rolls = [];
            if (!rollString) return rolls;
            rollString.replace(/"/g, '').split(',').forEach(part => {
                part = part.trim();
                if (part.includes('-')) {
                    let [s, e] = part.split('-').map(Number);
                    if (!isNaN(s) && !isNaN(e)) for (let r = s; r <= e; r++) rolls.push(r.toString());
                } else if (part) rolls.push(part);
            });
            return [...new Set(rolls)].sort((a,b) => parseInt(a) - parseInt(b));
        }

        function openAbsenteeModal(date, roomId) {
            currDate = date; currRoom = roomId;
            if (!absenteesCache[date]) absenteesCache[date] = {};
            tempAbs = [...(absenteesCache[date][roomId] || [])];
            
            const room = roomConfigsCache.find(r => r.id === roomId);
            document.getElementById('absenteeModalTitle').innerText = `Room ${room.name} - Absentees`;
            
            const grid = document.getElementById('absenteeRollGrid');
            grid.innerHTML = '';
            
            if (!room.classDetails || room.classDetails.length === 0) {
                grid.innerHTML = '<p class="text-xs text-slate-500 italic">No rolls defined.</p>';
            } else {
                room.classDetails.forEach(cls => {
                    let rArr = expandRolls(cls.rolls);
                    if(rArr.length > 0) {
                        let h = `<div class="mb-2"><span class="bg-indigo-100 text-indigo-800 border border-indigo-200 px-2 py-0.5 rounded text-[10px] font-black uppercase">Class ${cls.className}</span></div><div class="flex flex-wrap gap-1.5 mb-4">`;
                        rArr.forEach(roll => {
                            let uid = `${cls.className}_${roll}`;
                            let isAbs = tempAbs.includes(uid);
                            let btnClass = isAbs ? 'bg-rose-500 text-white border-rose-600 shadow-inner' : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-50';
                            h += `<button onclick="toggleAbsentee('${uid}', this)" class="w-10 h-10 rounded border-2 font-bold text-xs flex justify-center items-center transition-colors shadow-sm ${btnClass}">${roll}</button>`;
                        });
                        grid.innerHTML += h + `</div>`;
                    }

        /* =====================================================
           CSV PARSERS
        ==================================================== */
        async function processCSV(type) {
            let fileId = type === 'rooms' ? 'csvRooms' : (type === 'schedule' ? 'csvSchedule' : 'csvStaff');
            const file = document.getElementById(fileId).files[0];
            if (!file) return alert(`Select ${type} CSV.`);
            
            const reader = new FileReader();
            reader.onload = async (e) => {
                const rows = e.target.result.split('\n');
                const delimiter = rows[0].includes('\t') ? '\t' : ',';
                let payload = [];

                if (type === 'staff') {
                    rows.forEach(r => { let name = r.trim().replace(/"/g, ''); if(name) payload.push(name); });
                    if(payload.length > 0) {
                        teachersCache = payload;
                        await saveToDB('teachers', teachersCache, 'teachers');
                        alert("Staff imported successfully.");
                    }
                } else if (type === 'rooms') {
                    let roomsMap = {};
                    for(let i=1; i<rows.length; i++) {
                        let cols = rows[i].split(delimiter);
                        if (cols.length >= 5 && cols[0].trim() !== '') {
                            let rId = cols[0].trim().replace(/"/g, '');
                            let rName = cols[1].trim().replace(/"/g, '');
                            let rGender = cols[2].trim().replace(/"/g, '');
                            let rClass = cols[3].trim().replace(/"/g, '');
                            let rawRolls = cols.slice(4, cols.length-1).join(',').trim().replace(/"/g, '');
                            let rCapStr = cols[cols.length-1].trim().replace(/"/g, '');
                            let rCap = parseInt(rCapStr, 10);

                            if(!roomsMap[rId]) roomsMap[rId] = { id: rId, name: rName, gender: rGender, classesList: [], classDetails: [], totalCapacity: 0 };
                            roomsMap[rId].classesList.push(rClass);
                            roomsMap[rId].classDetails.push({ className: rClass, rolls: rawRolls, capacity: isNaN(rCap) ? 0 : rCap });
                            roomsMap[rId].totalCapacity += isNaN(rCap) ? 0 : rCap;
                        }
                    }
                    payload = Object.values(roomsMap);
                    if(payload.length > 0) {
                        roomConfigsCache = payload;
                        await saveToDB('roomConfigs', roomConfigsCache, 'rooms');
                        alert("Rooms imported successfully.");
                    }
                } else if (type === 'schedule') {
                    for(let i=1; i<rows.length; i++) {
                        let cols = rows[i].split(',');
                        if (cols.length >= 5 && cols[0].trim() !== '') {
                            payload.push({ id: 'S'+Date.now()+i, date: cols[0].trim(), time: cols[1].trim(), classes: cols[2].trim(), subject: cols[3].trim(), examName: cols[4].trim().replace(/\r/g, '') });
                        }
                    }
                    if(payload.length > 0) {
                        scheduleCache = payload;
                        await saveToDB('schedule', scheduleCache, 'schedule');
                        alert("Schedule imported successfully.");
                    }
                }
            };
            reader.readAsText(file);
        }

        async function saveToDB(key, payload, type) {
            const numId = parseInt(globalSchoolId, 10);
            if (recordIds[type]) await dbClient.from('exam_db').update({ json_payload: payload }).eq('id', recordIds[type]);
            else {
                const { data } = await dbClient.from('exam_db').insert({ data_key: key, json_payload: payload, school_id: numId }).select();
                if(data) recordIds[type] = data[0].id;
            }
        }

                            <i class="fas fa-print mr-2"></i> Print Selected
                        </button>
                    </div>
                    
                    <div class="mb-4 flex gap-4 bg-slate-50 p-2 rounded border border-slate-200 w-max">
                        <button onclick="document.querySelectorAll('.sticker-room-chk').forEach(cb => cb.checked = true)" class="text-xs font-bold text-indigo-600 hover:underline"><i class="fas fa-check-square mr-1"></i> Select All</button>
                        <span class="text-slate-300">|</span>
                        <button onclick="document.querySelectorAll('.sticker-room-chk').forEach(cb => cb.checked = false)" class="text-xs font-bold text-slate-500 hover:underline"><i class="far fa-square mr-1"></i> Deselect All</button>
                    </div>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                        ${roomCheckboxes}
                    </div>
                </div>
            `;
        }

        /* =====================================================
           DUTY REPORT CALCULATOR
        ==================================================== */
        function renderDutyReport(workspace) {
            let uniqueDates = [...new Set(scheduleCache.map(s => s.date))].sort((a,b) => new Date(a) - new Date(b));
            let dateOptions = uniqueDates.map(d => `<option value="${d}">${d.split('-').reverse().join('-')}</option>`).join('');

            workspace.innerHTML = `
                <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                    <h2 class="font-black text-slate-800 text-xl mb-4 border-b pb-3"><i class="fas fa-calculator text-indigo-500 mr-2"></i> Staff Duty Workload Calculator</h2>
                    
                    <div class="flex flex-col sm:flex-row gap-4 mb-6 bg-slate-50 p-4 rounded-lg border border-slate-200">
                        <div class="flex-1">
                            <label class="block text-[10px] font-black text-slate-500 mb-1 uppercase tracking-wide">Start Date</label>
                            <select id="reportStartDate" class="w-full p-2 border border-slate-300 rounded font-bold text-slate-700 outline-none">
                                <option value="">-- Select Start Date --</option>${dateOptions}
                            </select>
                        </div>
                        <div class="flex-1">
                            <label class="block text-[10px] font-black text-slate-500 mb-1 uppercase tracking-wide">End Date</label>
                            <select id="reportEndDate" class="w-full p-2 border border-slate-300 rounded font-bold text-slate-700 outline-none">
                                <option value="">-- Select End Date --</option>${dateOptions}
                            </select>
                        </div>
                        <div class="flex items-end">
                            <button onclick="calculateDutyReport()" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-6 rounded shadow-md transition-colors">
                                Calculate Duties
                            </button>
                        </div>
                    </div>

                    <div id="reportResultArea">
                        <p class="text-xs text-slate-400 italic text-center py-8">Select a date range to generate the teacher workload report.</p>
                    </div>
                </div>
            `;
        }

        function calculateDutyReport() {
            const start = document.getElementById('reportStartDate').value;
            const end = document.getElementById('reportEndDate').value;
            const resArea = document.getElementById('reportResultArea');

            if (!start || !end) return alert("Please select both start and end dates.");
            
            let startDate = new Date(start);
            let endDate = new Date(end);

            if (startDate > endDate) return alert("Start date cannot be after end date.");

            let workload = {};
            teachersCache.forEach(t => workload[t] = 0);

            // Filter dates within range
            let datesInRange = Object.keys(dutyRecordsCache).filter(d => {
                let curr = new Date(d);
                return curr >= startDate && curr <= endDate;
            });

            // Tally up the duties
            datesInRange.forEach(d => {
                Object.keys(dutyRecordsCache[d]).forEach(roomId => {
                    if(roomId === 'meta' || roomId === 'excluded') return;
                    let room = dutyRecordsCache[d][roomId];
                    (room.invigs || []).forEach(i => {
                        if (i && workload[i] !== undefined) workload[i]++;
                    });
                });
            });

            // Sort by highest workload, then alphabetically
            let sortedTeachers = Object.keys(workload).sort((a,b) => workload[b] - workload[a] || a.localeCompare(b));

            let html = `
                <table class="w-full border-collapse text-sm text-left shadow-sm rounded-lg overflow-hidden border border-slate-200">
                    <thead class="bg-slate-200 text-slate-700">
                        <tr>
                            <th class="p-3 border-b font-black uppercase">Teacher Name</th>
                            <th class="p-3 border-b font-black uppercase text-center w-32">Total Duties</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white">
            `;

            sortedTeachers.forEach(t => {
                let count = workload[t];
                let bgClass = count === 0 ? "bg-rose-50 text-rose-700 font-medium" : (count >= Math.max(...Object.values(workload)) && count > 0 ? "bg-indigo-50 text-indigo-900 font-bold" : "text-slate-800");
                
                html += `
                    <tr class="border-b hover:bg-slate-50 transition-colors ${bgClass}">
                        <td class="p-2 border-r pl-4">${t}</td>
                        <td class="p-2 text-center font-black text-lg">${count}</td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            resArea.innerHTML = html;
        }
    </script>
</body>
</html>
